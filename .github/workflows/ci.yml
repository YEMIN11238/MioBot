name: Source checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      MIOBOT_TEST_PYTHON: ${{ github.workspace }}/.venv-test/bin/python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare isolated document test environment
        run: |
          python -m venv .venv-test
          .venv-test/bin/python -m pip install -r tests/requirements.txt
      - name: Run application tests
        run: npm test
      - name: Run cloud and packaging tests
        run: node --test deploy/*.test.mjs
      - name: Build frontend
        run: npm run build
