# Optional overlay, applied after compose.yaml. Requires a domain pointing here.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      MIOBOT_DOMAIN: ${MIOBOT_DOMAIN:?Set MIOBOT_DOMAIN to your domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      miobot:
        condition: service_healthy
volumes:
  caddy-data:
  caddy-config:
